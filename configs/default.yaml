# Default pipeline config. Swap the detector or tracker here (or with --set), never in code.
# Every key is optional; see src/pathsense/config.py for the defaults and docs/PLAN.md.

detector:
  name: yolo26n        # yolo26n | yolo26s | rfdetr-nano | rfdetr-small
  weights: null        # null: pretrained COCO weights; later hf://MuhammadAzeem/pathsense-detector
  imgsz: null          # null: model default (YOLO 640, RF-DETR Nano 384)
  conf: 0.1            # kept low so ByteTrack can use low confidence boxes
  device: auto         # auto | cpu | cuda | 0
  slice: null          # tile size in px: detect small people in large frames (slow)
  drop_partial: false  # drop a partial box of a person also boxed whole (eye level, carts)

tracker:
  name: bytetrack      # bytetrack | botsort | ocsort | sort | cbiou
  # Extra tracker arguments, e.g. lost_track_buffer: 60. A setting the chosen tracker does
  # not take is skipped with a warning (OC-SORT has no activation threshold).
  params:
    track_activation_threshold: 0.6   # was 0.7: missed a person detected at 0.61 (NOTES.md)

camera:                # webcams only; files and streams ignore this
  calibrate: true      # measure a new camera once, then reuse (~/.config/pathsense/cameras.json)
  max_width: 1280      # largest picture to try
  fps: 30              # target frame rate
  dynamic_framerate: false   # false: steady FPS in dim light, darker picture; null: leave as is
  store: null          # null: default capture calibration file

analytics:
  # Counting line in pixels, e.g. [[0, 675], [1920, 675]]; more points follow a curved
  # edge. Standing on the first point looking at the next, crossing from your left to your
  # right is "enter": for a line drawn left to right, walking down the image enters.
  line: null           # null: no line counting
  line_margin: 5       # feet closer than this many pixels to the line do not change side
  line_margin_height: 0      # > 0: margin at least this share of the person's height
  line_confirm: 0.5    # seconds on the new side before a crossing counts (stops arm waving)
  line_bounce: 12      # drop a crossing the same ID undoes within this many seconds (0: off)
  # Zones, e.g. [{name: door, polygon: [[100, 500], [400, 500], [400, 900], [100, 900]]}]
  zones: []
  zone_confirm: 0.5    # seconds inside (or outside) before a zone enter (or exit) counts
  zone_count_present: true   # people already inside when the video starts count as entered
  hidden_legs: 0.25    # box this much shorter than the person: feet from the head; 0: off
