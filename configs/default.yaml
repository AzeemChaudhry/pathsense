# Default pipeline config. Swap the detector or tracker here (or with --set), never in code.
# Every key is optional; see src/pathsense/config.py for the defaults and docs/PLAN.md.

detector:
  name: yolo26n        # yolo26n | yolo26s | rfdetr-nano | rfdetr-small
  weights: null        # null: pretrained COCO weights; later hf://MuhammadAzeem/pathsense-detector
  imgsz: null          # null: model default (YOLO 640, RF-DETR Nano 384)
  conf: 0.1            # kept low so ByteTrack can use low confidence boxes
  device: auto         # auto | cpu | cuda | 0

tracker:
  name: bytetrack      # bytetrack | botsort | ocsort
  # Extra tracker arguments, e.g. lost_track_buffer: 60. A setting the chosen tracker does
  # not take is skipped with a warning (OC-SORT has no activation threshold).
  params:
    track_activation_threshold: 0.6   # was 0.7: missed a person detected at 0.61 (NOTES.md)

camera:                # webcams only; files and streams ignore this
  calibrate: true      # measure a new camera once, then reuse (~/.config/pathsense/cameras.json)
  max_width: 1280      # largest picture to try
  fps: 30              # target frame rate
  dynamic_framerate: false   # false: steady FPS in dim light, darker picture; null: leave as is
  store: null          # null: default capture calibration file

analytics:             # Phase 2
  line: null           # [[x1, y1], [x2, y2]] in pixels
  zones: []            # list of polygons
