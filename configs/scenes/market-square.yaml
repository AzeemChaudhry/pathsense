# Town square from a high window, almost top down (market-square.mp4, 2160x3840 portrait,
# 60 FPS, 8 s). A patterned square with a fountain; plain grey paving (a street) along the
# bottom, separated by a curved kerb.
# Use case: how many walked into the square from the street and out of it; who gathers
# at the fountain and for how long.
#   uv run pathsense run --scene configs/scenes/market-square.yaml
#
# Line: along the curved kerb (lowest at y 3100 in the middle, 2890 at the left edge,
# 2975 at the right), drawn right to left, so walking up into the square is IN and down
# into the street is OUT.
# Zone "fountain": the basin and its rim, where people sit and stand.
source: data/samples/market-square.mp4

# People are about 175 px tall in a 3840 px frame; at the default input size nobody is
# confident enough to track. Tiles of 960 px, each detected at 960, find 78 trackable
# people in a frame (57 with imgsz 1920 alone) at about 270 ms a frame on a GTX 1650:
# fine for recorded video (NOTES.md).
detector:
  imgsz: 960
  slice: 960

analytics:
  line: [[2160, 2975], [1920, 3015], [1440, 3090], [1200, 3100], [960, 3075], [480, 3000],
         [0, 2890]]
  zones:
    - name: fountain
      polygon: [[820, 1130], [1350, 1130], [1500, 1260], [1520, 1520], [1400, 1640],
                [850, 1640], [720, 1530], [700, 1250]]

# Every crossing listed from plain frames (NOTES.md), not by a person on site. An earlier
# count gave 16 OUT and 0 IN. 18 walk down into the street, and a woman in a green coat
# walks up across the kerb at the left edge in the first half second. The one call that
# stays unsure: the woman behind the hooded man at the right edge at 3.4 s, whose feet are
# hidden as she crosses. The 6 people at the fountain are there from the start.
truth:
  enter: 1
  exit: 18
  zones: {fountain: 6}
  crossings:
    - [0.3, exit, 1445]
    - [0.4, exit, 1787]
    - [0.5, enter, 38]
    - [0.6, exit, 119]
    - [0.8, exit, 686]
    - [1.2, exit, 235]
    - [1.3, exit, 2002]
    - [1.8, exit, 1601]
    - [1.8, exit, 1409]
    - [2.5, exit, 1551]
    - [2.8, exit, 2056]
    - [3.2, exit, 190]
    - [3.3, exit, 72]
    - [3.4, exit, 2120]
    - [4.3, exit, 47]
    - [4.6, exit, 239]
    - [4.7, exit, 133]
    - [5.0, exit, 941]
    - [5.8, exit, 741]
