[project]
name = "pathsense"
version = "0.1.0"
description = "Real time people detection, tracking and movement analytics"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "opencv-python",
    "supervision>=0.30",
    "trackers>=2.6",
    "ultralytics",
    "pyyaml",
]

[project.optional-dependencies]
rfdetr = ["rfdetr"]
app = ["gradio>=6", "fastrtc"]
dev = ["pytest", "ruff", "pre-commit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pathsense"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
