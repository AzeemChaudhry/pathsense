[project]
name = "pathsense"
dynamic = ["version"]  # read from src/pathsense/__init__.py
description = "Real time people detection, tracking and movement analytics"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "opencv-python",
    "supervision>=0.30",
    "trackers>=2.6",
    "ultralytics",
    "pyyaml",
]

[project.scripts]
pathsense = "pathsense.cli:main"

[project.optional-dependencies]
rfdetr = ["rfdetr"]
data = ["huggingface_hub", "pillow", "roboflow", "fiftyone"]
dev = ["pytest", "ruff", "pre-commit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pathsense/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pathsense"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: loads real model weights; run with PATHSENSE_SLOW=1"]
