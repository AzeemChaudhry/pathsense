name: Claude review

# Mention @claude in a PR comment, a PR review, or an issue to get a review or an answer.
# Review only: Claude can read the code and CI results and reply, but cannot push.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

jobs:
  claude:
    # Public repo: only the owner and collaborators can trigger it, so strangers cannot
    # spend the token by commenting @claude. Bot comments (including Claude's own replies)
    # never match, so it cannot trigger itself.
    if: |
      (github.event_name == 'issue_comment'
        && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment'
        && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review'
        && contains(github.event.review.body, '@claude')
        && contains(fromJSON('["OWNER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues'
        && contains(github.event.issue.body, '@claude')
        && contains(fromJSON('["OWNER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Claude acts with this job's GITHUB_TOKEN (passed below), not the Claude app token,
    # so these permissions are the hard limit: contents is read only, so pushes fail.
    permissions:
      contents: read
      pull-requests: write # reply and leave review comments
      issues: write # reply on issues
      actions: read # read CI results and logs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Pinned to a commit (v1.0.262): this step holds the token, so an upstream release
      # cannot change what runs here until the pin is moved on purpose.
      - uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          # Claude Pro/Max subscription token from `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          additional_permissions: |
            actions: read
          # Second guard on top of the read only token: no file editing tools at all.
          claude_args: |
            --disallowedTools Edit,MultiEdit,Write,NotebookEdit
            --append-system-prompt "You are a reviewer for this repository. Never edit files, commit, push or open pull requests. Read docs/DEVELOPMENT.md (workflow and project rules), then reply with findings, ordered by severity, each with the file and line."
