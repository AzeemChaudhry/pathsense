name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Lint
        run: uvx ruff check .
      - name: Smoke tests (no heavy deps)
        run: |
          uv venv
          uv pip install pytest
          uv run --no-project pytest
        env:
          PYTHONPATH: src
