name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Lint
        run: uvx ruff check .
      - name: Smoke tests (no heavy deps)
        # setup-uv already creates .venv, so running `uv venv` again fails; uvx avoids it.
        run: uvx pytest
        env:
          PYTHONPATH: src
