name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Ruff lint
        run: uvx ruff@0.17.2 check .  # keep in step with ruff in uv.lock
      - name: Ruff format
        run: uvx ruff@0.17.2 format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
          # torch and the CUDA wheels are several GB; caching them would evict everything
          # else from the 10 GB repo cache, and PyPI downloads are fast on runners anyway.
          enable-cache: false
      - name: Install (fails if uv.lock is out of date with pyproject.toml)
        run: uv sync --locked --extra dev
      - name: Tests
        run: uv run pytest
