# `uv run pre-commit install` sets up both hook types below. CI runs the same file checks.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2 # tests/test_repo_consistency.py keeps this equal to ruff in uv.lock
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
  - repo: local
    hooks:
      # Rejects a commit whose message carries tool attribution (docs/DEVELOPMENT.md).
      - id: no-tool-trailers
        name: no tool trailers in commit message
        language: pygrep
        entry: '(?i)^(co-authored-by|claude-session):|generated with \[?claude'
        stages: [commit-msg]
